<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencarian - AQUA REALM</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: #f4f6f9; color: #2b2d42; padding: 40px 20px; text-align: center; }
        .search-box-container { max-width: 600px; margin: 0 auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        h2 { color: #0d1b2a; margin-bottom: 20px; }
        .search-input-group { display: flex; gap: 10px; }
        .search-input-group input { flex: 1; padding: 12px 16px; border: 1px solid #ced4da; border-radius: 8px; font-size: 1rem; outline: none; }
        .search-input-group input:focus { border-color: #00b4d8; }
        .search-input-group button { background-color: #00b4d8; color: white; border: none; padding: 0 20px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .search-input-group button:hover { background-color: #0077b6; }
    </style>
</head>
<body>

    <div class="search-box-container">
        <h2>Cari Spesies Ikan Hias</h2>
        <div class="search-input-group">
            <input type="text" placeholder="Contoh: Cupang, Mas Koki, Discus...">
            <button type="button"><i class="fa-solid fa-magnifying-glass"></i> Cari</button>
        </div>
        <p style="margin-top: 15px; color: #8d99ae; font-size: 0.85rem;">Ketik nama ikan atau kategori untuk menemukan direktori penjual.</p>
    </div>

</body>
</html>
