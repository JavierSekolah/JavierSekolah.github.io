<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil - AQUA REALM</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: #f4f6f9; color: #2b2d42; padding: 30px 20px; }
        .profile-container { max-width: 600px; margin: 0 auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); text-align: center; }
        .profile-avatar { width: 90px; height: 90px; background-color: #e2e8f0; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 2.5rem; color: #4a5568; }
        h2 { color: #0d1b2a; margin-bottom: 5px; }
        p.role { color: #8d99ae; font-size: 0.9rem; margin-bottom: 25px; }
        .profile-info { text-align: left; background: #f8f9fa; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .profile-info p { margin-bottom: 8px; font-size: 0.95rem; color: #2b2d42; }
        .profile-info p span { font-weight: 600; color: #0d1b2a; }
        .btn-logout { background-color: #d90429; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 500; width: 100%; transition: 0.3s; }
        .btn-logout:hover { background-color: #b7031d; }
    </style>
</head>
<body>

    <div class="profile-container">
        <div class="profile-avatar">
            <i class="fa-solid fa-user"></i>
        </div>
        <h2>Tamu Pengunjung</h2>
        <p class="role">Status: Pembeli / Penghobi Akuatik</p>
        
        <div class="profile-info">
            <p><span>Email:</span> guest_aquarealm@domain.com</p>
            <p><span>Lokasi:</span> Indonesia</p>
            <p><span>Akses Akun:</span> Standar Pengunjung Webstore</p>
        </div>

        <button type="button" class="btn-logout">Masuk / Daftar Akun Mitra</button>
    </div>

</body>
</html>
