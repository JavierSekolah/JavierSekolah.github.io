<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keranjang - AQUA REALM</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: #f4f6f9; color: #2b2d42; padding: 30px 20px; }
        .cart-container { max-width: 700px; margin: 0 auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); text-align: center; }
        h2 { color: #0d1b2a; margin-bottom: 20px; font-size: 1.8rem; }
        .cart-empty { padding: 30px 0; color: #8d99ae; }
        .cart-empty i { font-size: 3rem; margin-bottom: 15px; color: #ced4da; }
        .btn-shop { display: inline-block; background-color: #00b4d8; color: white; padding: 10px 25px; border-radius: 30px; text-decoration: none; font-weight: 600; margin-top: 15px; transition: 0.3s; }
        .btn-shop:hover { background-color: #0077b6; }
    </style>
</head>
<body>

    <div class="cart-container">
        <h2>Keranjang Belanja Anda</h2>
        <div class="cart-empty">
            <i class="fa-solid fa-cart-shopping"></i>
            <p>Keranjang Anda masih kosong atau Anda belum memilih produk dari mitra penjual.</p>
            <a href="katalog.html" class="btn-shop">Jelajahi Katalog Ikan</a>
        </div>
    </div>

</body>
</html>
