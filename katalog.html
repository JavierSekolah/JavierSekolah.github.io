<!-- Script Filter Real-Time -->
    <script>
        function applyFilters() {
            const searchValue = document.getElementById('searchInput').value.toLowerCase();
            const catValue = document.getElementById('filterCategory').value;
            const careValue = document.getElementById('filterCare').value;
            const reefValue = document.getElementById('filterReef').value;

            const cards = document.querySelectorAll('.product-card');

            cards.forEach(card => {
                const searchText = card.getAttribute('data-search');
                const cardCat = card.getAttribute('data-cat');
                const cardCare = card.getAttribute('data-care');
                const cardReef = card.getAttribute('data-reef');

                const matchesSearch = searchText.includes(searchValue);
                const matchesCat = (catValue === 'all') || (cardCat === catValue);
                const matchesCare = (careValue === 'all') || (cardCare === careValue);
                const matchesReef = (reefValue === 'all') || (cardReef === reefValue);

                if (matchesSearch && matchesCat && matchesCare && matchesReef) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });

            // Menyembunyikan/menampilkan header grup kategori jika produk di dalamnya kosong
            ['fish', 'coral', 'invert'].forEach(cat => {
                const group = document.getElementById('group-' + cat);
                if (!group) return;
                const cardsInGroup = group.querySelectorAll('.product-card');
                let visibleCount = 0;
                
                cardsInGroup.forEach(c => {
                    if (c.style.display !== 'none') visibleCount++;
                });
                
                if (catValue !== 'all' && catValue !== cat) {
                    group.style.display = 'none';
                } else if (visibleCount === 0 && (searchValue !== '' || careValue !== 'all' || reefValue !== 'all' || catValue !== 'all')) {
                    group.style.display = 'none';
                } else {
                    group.style.display = 'block';
                }
            });
        }

        // Jalankan filter otomatis saat halaman dimuat agar semua produk tampil
        window.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.product-card');
            cards.forEach(card => card.style.display = 'flex');

            const urlParams = new URLSearchParams(window.location.search);
            const query = urlParams.get('q');
            if (query) {
                document.getElementById('searchInput').value = query;
                applyFilters();
            }

            const hash = window.location.hash.replace('#', '');
            if (hash) {
                if (['fish', 'coral', 'invert'].includes(hash)) {
                    document.getElementById('filterCategory').value = hash;
                    applyFilters();
                }
            }
        });
    </script>
